<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>📰 News Pro</title>
    <style>
        /* ===== CSS VARIABLES FOR THEMING ===== */
        :root {
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --bg-header: #ffffff;
            --bg-topbar: #1a1a1a;
            --text-primary: #222222;
            --text-secondary: #555555;
            --text-muted: #999999;
            --text-light: #aaaaaa;
            --border-color: #eeeeee;
            --shadow-color: rgba(0,0,0,0.05);
            --shadow-hover: rgba(0,0,0,0.1);
            --tag-bg: #f5f5f5;
            --tag-text: #888888;
            --ai-bg: #ff4a4a;
            --ai-text: #ffffff;
            --read-time-bg: #f0f0f0;
            --read-time-text: #888888;
            --source-tag-bg: #fff0f0;
            --source-tag-text: #ff4a4a;
            --breaking-bg: #cc0000;
            --breaking-text: #ffffff;
        }

        /* ===== DARK MODE VARIABLES ===== */
        body.dark-mode {
            --bg-body: #0d0d0d;
            --bg-card: #1a1a1a;
            --bg-header: #1a1a1a;
            --bg-topbar: #0d0d0d;
            --text-primary: #e8e8e8;
            --text-secondary: #bbbbbb;
            --text-muted: #777777;
            --text-light: #555555;
            --border-color: #2a2a2a;
            --shadow-color: rgba(0,0,0,0.3);
            --shadow-hover: rgba(0,0,0,0.5);
            --tag-bg: #2a2a2a;
            --tag-text: #aaaaaa;
            --read-time-bg: #2a2a2a;
            --read-time-text: #aaaaaa;
            --source-tag-bg: #2a1a1a;
            --source-tag-text: #ff6a6a;
            --breaking-bg: #990000;
            --breaking-text: #ffffff;
        }

        /* ===== RESET & BASE ===== */
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI', Roboto, Arial, sans-serif;background:var(--bg-body);min-height:100vh;padding:0;color:var(--text-primary);transition:background 0.3s ease, color 0.3s ease}
        .container{max-width:1100px;margin:0 auto;padding:20px 15px 40px}

        /* ===== BREAKING NEWS BANNER ===== */
        .breaking-banner{background:var(--breaking-bg);color:var(--breaking-text);padding:10px 20px;display:none;align-items:center;gap:15px;position:sticky;top:0;z-index:1000;box-shadow:0 2px 15px rgba(204,0,0,0.3);transition:all 0.3s ease}
        .breaking-banner.show{display:flex}
        .breaking-banner .breaking-label{background:rgba(255,255,255,0.2);padding:3px 15px;border-radius:20px;font-size:0.65em;font-weight:700;text-transform:uppercase;letter-spacing:2px;white-space:nowrap;animation:pulse 1.5s ease-in-out infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
        .breaking-banner .breaking-text{flex:1;font-size:0.9em;font-weight:500}
        .breaking-banner .breaking-text a{color:#fff;text-decoration:underline;font-weight:700}
        .breaking-banner .breaking-close{background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:1.2em;cursor:pointer;padding:5px 12px;border-radius:20px;transition:background 0.3s ease;font-weight:700;white-space:nowrap}
        .breaking-banner .breaking-close:hover{background:rgba(255,255,255,0.25)}
        .breaking-banner .breaking-close .icon{display:inline-block;transition:transform 0.3s ease}
        .breaking-banner .breaking-close:hover .icon{transform:rotate(90deg)}

        /* ===== TOP BAR ===== */
        .top-bar{background:var(--bg-topbar);color:#aaa;padding:8px 0;font-size:0.7em;border-bottom:1px solid #333;display:block;transition:background 0.3s ease}
        .top-bar .inner{max-width:1100px;margin:0 auto;padding:0 15px;display:flex;justify-content:space-between;align-items:center}
        .top-bar .inner a{color:#aaa;text-decoration:none;margin-left:15px;transition:color .2s}
        .top-bar .inner a:hover{color:#fff}
        .top-bar .inner .date{color:#888}

        /* ===== HEADER ===== */
        .header{background:var(--bg-header);padding:20px 0;border-bottom:3px solid #ff4a4a;margin-bottom:30px;box-shadow:0 2px 10px var(--shadow-color);transition:background 0.3s ease, box-shadow 0.3s ease}
        .header .inner{max-width:1100px;margin:0 auto;padding:0 15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
        .header .logo{font-size:2.2em;font-weight:900;color:var(--text-primary);letter-spacing:-1px;transition:color 0.3s ease}
        .header .logo span{color:#ff4a4a}
        .header .subtitle{color:var(--text-muted);font-size:0.7em;font-weight:300;letter-spacing:3px;margin-top:2px;transition:color 0.3s ease}
        .header .header-right{display:flex;align-items:center;gap:15px}
        .header .header-right .stats{color:var(--text-muted);font-size:0.75em;background:var(--tag-bg);padding:6px 16px;border-radius:20px;border:1px solid var(--border-color);transition:all 0.3s ease}
        .header .header-right .stats span{color:var(--text-primary);font-weight:700;transition:color 0.3s ease}

        /* ===== DARK MODE TOGGLE ===== */
        .theme-toggle{background:var(--tag-bg);border:1px solid var(--border-color);border-radius:30px;padding:6px 14px;cursor:pointer;font-size:1.1em;transition:all 0.3s ease;color:var(--text-primary);display:flex;align-items:center;gap:8px}
        .theme-toggle:hover{transform:scale(1.05)}
        .theme-toggle .icon{font-size:1.2em}
        .theme-toggle .label{font-size:0.7em;font-weight:600}

        /* ===== CATEGORIES ===== */
        .category-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:30px;background:var(--bg-card);padding:10px 18px;border-radius:8px;box-shadow:0 2px 8px var(--shadow-color);border:1px solid var(--border-color);transition:all 0.3s ease}
        .category-filter button{padding:8px 18px;background:transparent;border:none;border-radius:30px;color:var(--text-muted);cursor:pointer;transition:all .25s ease;font-size:0.8em;font-weight:600}
        .category-filter button:hover{background:var(--tag-bg);color:var(--text-primary)}
        .category-filter button.active{background:#ff4a4a;color:#fff;box-shadow:0 2px 10px rgba(255,74,74,0.2)}

        /* ===== NEWS GRID ===== */
        .news-grid{display:grid;grid-template-columns:1fr;gap:25px}
        @media(min-width:768px){.news-grid{grid-template-columns:repeat(2,1fr)}
        .news-grid .featured{grid-column:1 / -1}}
        @media(min-width:1024px){.news-grid{grid-template-columns:repeat(3,1fr)}
        .news-grid .featured{grid-column:1 / -1}}

        /* ===== ARTICLE CARD ===== */
        .article-card{background:var(--bg-card);border-radius:10px;overflow:hidden;border:1px solid var(--border-color);transition:all .3s ease;box-shadow:0 2px 8px var(--shadow-color)}
        .article-card:hover{box-shadow:0 8px 30px var(--shadow-hover);transform:translateY(-4px);border-color:var(--text-light)}
        .article-card .card-image{width:100%;height:200px;overflow:hidden;background:#1a1a1a;position:relative}
        .article-card .card-image img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
        .article-card:hover .card-image img{transform:scale(1.03)}
        .article-card .card-image .no-image{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#555;font-size:2.5em;background:#1a1a1a}
        .article-card .card-content{padding:18px 20px 20px}
        .article-card .card-content .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
        .article-card .card-content .source-tag{display:inline-block;padding:2px 12px;border-radius:20px;font-size:0.6em;font-weight:700;color:var(--source-tag-text);background:var(--source-tag-bg);text-transform:uppercase;letter-spacing:0.5px;transition:all 0.3s ease}
        .article-card .card-content .category-tag{display:inline-block;padding:2px 12px;border-radius:20px;font-size:0.55em;font-weight:600;color:var(--tag-text);background:var(--tag-bg);text-transform:uppercase;letter-spacing:0.5px;transition:all 0.3s ease}
        .article-card .card-content .ai-badge{display:inline-block;padding:2px 12px;border-radius:20px;font-size:0.55em;font-weight:700;color:var(--ai-text);background:var(--ai-bg);text-transform:uppercase;letter-spacing:0.5px}
        .article-card .card-content .read-time{display:inline-block;padding:2px 12px;border-radius:20px;font-size:0.55em;font-weight:600;color:var(--read-time-text);background:var(--read-time-bg);margin-left:4px;transition:all 0.3s ease}
        .article-card .card-content h2{font-size:1.15em;font-weight:700;margin-bottom:8px;line-height:1.4}
        .article-card .card-content h2 a{color:var(--text-primary);text-decoration:none;transition:color .2s}
        .article-card .card-content h2 a:hover{color:#ff4a4a}
        .article-card .card-content .summary{color:var(--text-secondary);font-size:0.9em;line-height:1.7;margin-bottom:12px;transition:color 0.3s ease}
        .article-card .card-content .summary .ai-label{color:#ff4a4a;font-weight:600;font-size:0.8em}
        .article-card .card-content .meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:0.7em;color:var(--text-muted);border-top:1px solid var(--border-color);padding-top:12px;margin-top:4px;transition:all 0.3s ease}
        .article-card .card-content .meta .source{color:var(--text-muted)}
        .article-card .card-content .meta .time{color:var(--text-light)}
        .article-card .card-content .read-more{color:#ff4a4a;text-decoration:none;font-weight:700;transition:all .2s;font-size:0.8em}
        .article-card .card-content .read-more:hover{color:#cc0000;text-decoration:underline}

        /* ===== LOADING ===== */
        .loading-state{text-align:center;padding:60px 20px;color:var(--text-muted);grid-column:1 / -1;transition:color 0.3s ease}
        .spinner{display:inline-block;width:40px;height:40px;border:3px solid var(--border-color);border-top:3px solid #ff4a4a;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;transition:border-color 0.3s ease}
        @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

        /* ===== REFRESH ===== */
        .refresh-btn{display:block;width:100%;max-width:280px;margin:35px auto 0;padding:14px 30px;background:#ff4a4a;border:none;border-radius:50px;color:#fff;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:2px;transition:all .3s ease;font-size:0.85em;box-shadow:0 4px 15px rgba(255,74,74,0.2)}
        .refresh-btn:hover{background:#cc0000;transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,74,74,0.3)}

        /* ===== FOOTER ===== */
        .footer{text-align:center;color:var(--text-light);font-size:.7em;padding:35px 0 10px;border-top:1px solid var(--border-color);margin-top:30px;transition:all 0.3s ease}
        .footer .heart{color:#ff4a4a}

        /* ===== RESPONSIVE ===== */
        @media(max-width:767px){.container{padding:15px 12px 30px}
        .header{padding:15px 0}
        .header .logo{font-size:1.6em}
        .header .header-right .stats{font-size:0.65em;padding:4px 12px}
        .category-filter{padding:8px 12px;gap:4px;justify-content:center}
        .category-filter button{font-size:0.65em;padding:5px 12px}
        .article-card .card-image{height:160px}
        .article-card .card-content{padding:14px 16px 16px}
        .article-card .card-content h2{font-size:1em}
        .article-card .card-content .summary{font-size:0.85em}
        .refresh-btn{max-width:100%}
        .header .header-right{gap:10px}
        .theme-toggle{padding:4px 10px;font-size:0.9em}
        .theme-toggle .label{display:none}
        .breaking-banner{padding:8px 12px;flex-wrap:wrap;gap:8px}
        .breaking-banner .breaking-text{font-size:0.8em;order:3;flex-basis:100%}
        .breaking-banner .breaking-label{font-size:0.55em}
        .breaking-banner .breaking-close{padding:3px 10px;font-size:1em}}
        @media(max-width:480px){.header .logo{font-size:1.3em}
        .header .subtitle{font-size:0.6em}
        .article-card .card-image{height:140px}
        .news-grid{gap:15px}}
    </style>
</head>
<body>

<!-- ===== BREAKING NEWS BANNER ===== -->
<div class="breaking-banner" id="breakingBanner">
    <span class="breaking-label">🔴 BREAKING</span>
    <span class="breaking-text" id="breakingText">
        <a href="#" target="_blank">Click here for the latest breaking news</a>
    </span>
    <button class="breaking-close" onclick="closeBreaking()">
        <span class="icon">✕</span>
    </button>
</div>

<!-- TOP BAR -->
<div class="top-bar">
    <div class="inner">
        <span class="date" id="currentDate"></span>
        <div>
            <a href="/">Home</a>
            <a href="/news">News</a>
        </div>
    </div>
</div>

<!-- HEADER -->
<div class="header">
    <div class="inner">
        <div>
            <div class="logo">📰 <span>News</span>Pro</div>
            <div class="subtitle">✦ Breaking Stories • Global Coverage ✦</div>
        </div>
        <div class="header-right">
            <div class="stats"><span id="articleCount">0</span> articles</div>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">
                <span class="icon">🌙</span>
                <span class="label">Dark</span>
            </button>
        </div>
    </div>
</div>

<!-- MAIN CONTAINER -->
<div class="container">
    <!-- CATEGORIES -->
    <div class="category-filter" id="categoryFilter">
        <button class="active" data-category="all">All</button>
    </div>

    <!-- NEWS GRID -->
    <div class="news-grid" id="newsContent">
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading latest news...</p>
        </div>
    </div>

    <!-- REFRESH -->
    <button class="refresh-btn" onclick="loadNews()">⟳ Refresh News</button>

    <div class="footer">
        <span class="heart">❤</span> NewsPro • All sources credited
    </div>
</div>

<script>
    // ===== BREAKING NEWS =====
    function showBreakingNews(title, link) {
        const banner = document.getElementById('breakingBanner');
        const text = document.getElementById('breakingText');
        
        // Check if user has dismissed this specific breaking news
        const dismissed = localStorage.getItem('breaking_dismissed');
        if (dismissed === title) {
            return;
        }
        
        text.innerHTML = `<a href="${link}" target="_blank">${title}</a>`;
        banner.classList.add('show');
    }

    function closeBreaking() {
        const banner = document.getElementById('breakingBanner');
        const text = document.getElementById('breakingText');
        const title = text.textContent.trim();
        
        banner.classList.remove('show');
        // Save dismissed state so it doesn't show again
        localStorage.setItem('breaking_dismissed', title);
        // Remove after 1 hour so new breaking news can show
        setTimeout(() => {
            localStorage.removeItem('breaking_dismissed');
        }, 3600000);
    }

    // ===== DARK MODE =====
    function toggleTheme() {
        const body = document.body;
        const toggle = document.getElementById('themeToggle');
        const icon = toggle.querySelector('.icon');
        const label = toggle.querySelector('.label');
        
        body.classList.toggle('dark-mode');
        
        if (body.classList.contains('dark-mode')) {
            icon.textContent = '☀️';
            label.textContent = 'Light';
            localStorage.setItem('theme', 'dark');
        } else {
            icon.textContent = '🌙';
            label.textContent = 'Dark';
            localStorage.setItem('theme', 'light');
        }
    }

    // Load saved theme preference
    function loadTheme() {
        const savedTheme = localStorage.getItem('theme');
        const body = document.body;
        const toggle = document.getElementById('themeToggle');
        const icon = toggle.querySelector('.icon');
        const label = toggle.querySelector('.label');
        
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
            icon.textContent = '☀️';
            label.textContent = 'Light';
        } else {
            body.classList.remove('dark-mode');
            icon.textContent = '🌙';
            label.textContent = 'Dark';
        }
    }

    // ===== STATE =====
    let currentCategory = 'all';
    let allArticles = [];

    // ===== SET CURRENT DATE =====
    function setDate() {
        const now = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', options);
    }
    setDate();

    // ===== LOAD NEWS =====
    async function loadNews() {
        const grid = document.getElementById('newsContent');
        grid.innerHTML = `<div class="loading-state"><div class="spinner"></div><p>Loading latest news...</p></div>`;

        try {
            const response = await fetch('/api/news');
            const data = await response.json();
            allArticles = data.articles || [];
            
            document.getElementById('articleCount').textContent = data.total || 0;
            
            const categories = await fetch('/api/categories');
            const catData = await categories.json();
            updateCategories(catData.categories);
            
            renderNews(allArticles);
            
            // ===== CHECK FOR BREAKING NEWS =====
            // Check if any article has "breaking" or "just in" in title
            const breakingKeywords = ['breaking', 'just in', 'urgent', 'breaking news', 'live', 'update'];
            for (const article of allArticles) {
                const title = article.title.toLowerCase();
                for (const keyword of breakingKeywords) {
                    if (title.includes(keyword)) {
                        showBreakingNews(article.title, article.link);
                        break;
                    }
                }
            }
            
        } catch (err) {
            grid.innerHTML = `
                <div class="article-card" style="text-align:center;padding:40px 20px;grid-column:1/-1;">
                    <p style="color:#ff4a4a;font-weight:600;">❌ Error loading news</p>
                    <p style="color:var(--text-muted);font-size:0.9em;margin-top:8px;">${err.message}</p>
                    <button onclick="loadNews()" style="margin-top:15px;padding:10px 25px;background:#ff4a4a;border:none;border-radius:30px;color:#fff;font-weight:600;cursor:pointer;">Retry</button>
                </div>
            `;
        }
    }

    // ===== UPDATE CATEGORIES =====
    function updateCategories(categories) {
        const container = document.getElementById('categoryFilter');
        container.innerHTML = `<button class="active" data-category="all">All</button>`;
        
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.dataset.category = cat;
            btn.textContent = cat;
            btn.addEventListener('click', function() {
                document.querySelectorAll('#categoryFilter button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                filterNews(this.dataset.category);
            });
            container.appendChild(btn);
        });
    }

    // ===== FILTER NEWS =====
    function filterNews(category) {
        currentCategory = category;
        if (category === 'all') {
            renderNews(allArticles);
        } else {
            const filtered = allArticles.filter(article => 
                article.category === category
            );
            renderNews(filtered);
        }
    }

    // ===== RENDER NEWS =====
    function renderNews(articles) {
        const grid = document.getElementById('newsContent');
        
        if (!articles || articles.length === 0) {
            grid.innerHTML = `<div class="article-card" style="text-align:center;padding:40px 20px;grid-column:1/-1;"><p style="color:var(--text-muted);">📭 No articles found</p></div>`;
            return;
        }

        let html = '';
        articles.forEach((article, index) => {
            const isFeatured = index === 0;
            const featuredClass = isFeatured ? 'featured' : '';
            const timeAgo = article.published ? timeSince(article.published) : '';
            
            let imageHtml = '';
            if (article.image) {
                imageHtml = `<img src="${article.image}" alt="${article.title}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'no-image\\'>📰</div>'">`;
            } else {
                imageHtml = `<div class="no-image">📰</div>`;
            }

            const summaryHtml = article.rewritten ? 
                `<span class="ai-label">✨ AI Rewritten:</span> ${article.summary}` : 
                article.summary;

            const readTimeText = article.read_time ? 
                `<span class="read-time">⏱️ ${article.read_time} min read</span>` : '';

            html += `
                <div class="article-card ${featuredClass}">
                    <div class="card-image">${imageHtml}</div>
                    <div class="card-content">
                        <div class="tags">
                            <span class="source-tag">${article.source || 'News'}</span>
                            <span class="category-tag">${article.category || 'General'}</span>
                            ${article.rewritten ? '<span class="ai-badge">✨ AI</span>' : ''}
                            ${readTimeText}
                        </div>
                        <h2><a href="${article.link}" target="_blank">${article.title}</a></h2>
                        <div class="summary">${summaryHtml}</div>
                        <div class="meta">
                            <span class="source">📰 ${article.source || 'Unknown'}</span>
                            <span class="time">${timeAgo}</span>
                            <a href="${article.link}" target="_blank" class="read-more">Read full article →</a>
                        </div>
                    </div>
                </div>
            `;
        });

        grid.innerHTML = html;
    }

    // ===== TIME AGO =====
    function timeSince(dateString) {
        try {
            const date = new Date(dateString);
            if (isNaN(date)) return '';
            const seconds = Math.floor((new Date() - date) / 1000);
            
            const intervals = [
                {label: 'year', seconds: 31536000},
                {label: 'month', seconds: 2592000},
                {label: 'day', seconds: 86400},
                {label: 'hour', seconds: 3600},
                {label: 'minute', seconds: 60}
            ];
            
            for (const interval of intervals) {
                const count = Math.floor(seconds / interval.seconds);
                if (count >= 1) {
                    return `${count} ${interval.label}${count > 1 ? 's' : ''} ago`;
                }
            }
            return 'Just now';
        } catch {
            return '';
        }
    }

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', function() {
        loadTheme();
        loadNews();
    });
</script>
</body>
</html>
